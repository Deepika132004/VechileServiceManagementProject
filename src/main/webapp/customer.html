<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Add Customer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="header">

        <div class="logo">
            🚗 Vehicle Service Management
        </div>

        <a href="index.html" class="back">
            ← Back
        </a>

    </div>


    <div class="container">

        <h1>👤 Add Customer</h1>

        <form action="AddCustomerServlet" method="post">

            <label>Customer Name</label>

            <input
                type="text"
                name="customerName"
                placeholder="Enter customer name"
                required
            >


            <label>Phone</label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>Address</label>

            <textarea
                name="address"
                placeholder="Enter address"
                required
            ></textarea>


            <button type="submit">
                Save Customer
            </button>

        </form>

    </div>

</body>
</html>

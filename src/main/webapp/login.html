<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Vehicle Service</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #334155
        );
}

/* LOGIN CARD */

.login-container {

    width: 400px;

    padding: 40px;

    background: rgba(255,255,255,0.10);

    backdrop-filter: blur(15px);

    border:
        1px solid rgba(255,255,255,0.2);

    border-radius: 20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.4);

    color: white;
}

/* ICON */

.logo {

    text-align: center;

    font-size: 60px;

    margin-bottom: 10px;
}

h1 {

    text-align: center;

    font-size: 28px;

    margin-bottom: 8px;
}

.subtitle {

    text-align: center;

    color: #cbd5e1;

    margin-bottom: 30px;
}

/* INPUT */

.input-group {

    margin-bottom: 20px;
}

label {

    display: block;

    margin-bottom: 8px;

    font-size: 15px;

    font-weight: 600;
}

input {

    width: 100%;

    padding: 13px 15px;

    border: none;

    outline: none;

    border-radius: 9px;

    font-size: 15px;
}

input:focus {

    box-shadow:
        0 0 0 2px #60a5fa;
}

/* LOGIN BUTTON */

button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

button:hover {

    background: #1d4ed8;

    transform: translateY(-2px);
}

/* BACK HOME */

.back {

    text-align: center;

    margin-top: 22px;
}

.back a {

    color: #93c5fd;

    text-decoration: none;

    font-size: 15px;
}

.back a:hover {

    text-decoration: underline;
}

/* MOBILE */

@media(max-width: 500px) {

    .login-container {

        width: 90%;

        padding: 30px 25px;
    }
}

</style>

</head>

<body>


<div class="login-container">


    <div class="logo">
        🔐
    </div>


    <h1>
        Admin Login
    </h1>


    <p class="subtitle">
        Vehicle Service Management System
    </p>


    <!-- LOGIN FORM -->

    <form action="LoginServlet"
          method="post">


        <div class="input-group">

            <label>
                Admin Name
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter admin name"
                required>

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>

        </div>


        <button type="submit">

            🔐 Login

        </button>


    </form>


    <!-- BACK TO HOME -->

    <div class="back">

        <a href="index.html">

            ← Back to Home

        </a>

    </div>


</div>


</body>

</html>
